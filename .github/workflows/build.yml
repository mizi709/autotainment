name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK (Lite & Full)
        run: gradle assembleLiteDebug assembleFullDebug --stacktrace --no-daemon

      - name: Namakan APK
        run: |
          cp app/build/outputs/apk/lite/debug/app-lite-debug.apk "AutoTainment-Lite-v0.1.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/full/debug/app-full-debug.apk "AutoTainment-Full-v0.1.${{ github.run_number }}.apk"

      - name: Simpan sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoTainment-v0.1.${{ github.run_number }}
          path: AutoTainment-*.apk

      - name: Terbit di Releases (senang download dari phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AutoTainment v0.1.${{ github.run_number }}
          prerelease: true
          body: |
            Build automatik dari commit ${{ github.sha }}.

            **Lite** — install terus dari phone (tiada paparan lagu).
            **Full** — ada paparan lagu; mesti install melalui ADB dari PC (Play Protect Malaysia block bila install dari browser).
          files: AutoTainment-*.apk
